<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SnapLedger — Legal</title>
  <meta name="description" content="Legal documents for SnapLedger." />
  <style>
    :root {
      color-scheme: light dark;
      --text: #1a1a1a;
      --muted: #555;
      --bg: #fafafa;
      --link: #0b57d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f2f2;
        --muted: #aaa;
        --bg: #121212;
        --link: #8ab4f8;
      }
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); }
    ul { padding-left: 1.25rem; }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>SnapLedger</h1>
    <p>Legal documents</p>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms &amp; Conditions</a></li>
    </ul>
  </main>
</body>
</html>
